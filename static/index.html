<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Usage Tracker</title>
<style>
  :root {
    --bg: #0a0c10;
    --card: rgba(22, 27, 34, 0.72);
    --card-solid: #161b22;
    --border: rgba(240, 246, 252, 0.09);
    --border-strong: rgba(240, 246, 252, 0.16);
    --text: #e6edf3;
    --muted: #8b949e;
    --faint: #6e7681;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --track: rgba(240, 246, 252, 0.06);
    --accent: #7aa2f7;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scrollbar-color: #30363d var(--bg); }
  body {
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(122, 162, 247, 0.09), transparent 60%),
      radial-gradient(900px 450px at 85% -5%, rgba(217, 119, 87, 0.07), transparent 55%),
      radial-gradient(1200px 700px at 50% 110%, rgba(66, 133, 244, 0.05), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, sans-serif;
    min-height: 100vh;
    padding: 40px 22px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 30px; flex-wrap: wrap; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    background: linear-gradient(135deg, #d97757 0%, #a78bfa 55%, #4285f4 100%);
    display: grid; place-items: center; font-size: 19px;
    box-shadow: 0 4px 18px rgba(122, 162, 247, 0.25);
  }
  h1 {
    font-size: 21px; font-weight: 700; letter-spacing: -0.02em;
    background: linear-gradient(90deg, #e6edf3, #9baec8);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tagline { color: var(--faint); font-size: 12.5px; margin-top: 2px; }
  .meta { color: var(--muted); font-size: 13px; display: flex; gap: 14px; align-items: center; }
  .live {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted);
  }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.5); animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.45); }
    70% { box-shadow: 0 0 0 7px rgba(63, 185, 80, 0); }
    100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); }
  }
  button {
    background: rgba(240, 246, 252, 0.04); color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 6px 16px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .18s ease;
  }
  button:hover { border-color: var(--accent); background: rgba(122, 162, 247, 0.08); }
  button:disabled { opacity: 0.55; cursor: default; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(248px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 22px;
    position: relative; overflow: hidden;
    backdrop-filter: blur(8px);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .grid > .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 2.5px;
    background: linear-gradient(90deg, var(--accent), transparent 75%);
    opacity: 0.85;
  }
  .grid > .card:hover {
    transform: translateY(-2px);
    border-color: var(--border-strong);
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
  }
  .card h2 {
    font-size: 15.5px; font-weight: 650; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 9px; margin-bottom: 3px;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none;
    box-shadow: 0 0 8px 0 currentColor;
  }
  .plan {
    color: var(--faint); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.9px; font-weight: 600; margin-bottom: 16px;
  }
  .bar-row { margin-bottom: 15px; }
  .bar-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; margin-bottom: 6px;
  }
  .bar-head .pct { font-variant-numeric: tabular-nums; font-weight: 650; font-size: 12.5px; }
  .track {
    background: var(--track); border-radius: 6px; height: 8px; overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
  }
  .fill {
    height: 100%; border-radius: 6px; min-width: 2px; position: relative;
    transition: width .5s cubic-bezier(.22, 1, .36, 1);
  }
  .fill::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 55%);
    border-radius: 6px;
  }
  .sub { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .bigstat {
    font-size: 30px; font-weight: 750; margin: 6px 0 2px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
    background: linear-gradient(180deg, #f0f6fc, #a5b3c4);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .bigstat span {
    font-size: 13.5px; color: var(--muted); font-weight: 450; letter-spacing: 0;
    -webkit-text-fill-color: var(--muted);
  }
  .footer-note {
    color: var(--faint); font-size: 11.5px; margin-top: 14px;
    padding-top: 12px; border-top: 1px solid var(--border);
  }
  .error { color: var(--red); font-size: 13px; line-height: 1.5; }
  .skeleton { color: var(--muted); font-size: 13px; }

  .section-title {
    font-size: 15px; font-weight: 650; letter-spacing: -0.01em;
    margin: 34px 0 14px; display: flex; align-items: center; gap: 10px;
  }
  .section-title::before {
    content: ""; width: 4px; height: 16px; border-radius: 2px;
    background: linear-gradient(180deg, var(--accent), rgba(122, 162, 247, 0.2));
  }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  @media (max-width: 760px) { .charts { grid-template-columns: 1fr; } }
  .chart-title {
    font-size: 12px; color: var(--muted); margin-bottom: 10px;
    text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600;
  }
  .chart svg { width: 100%; height: 160px; display: block; }
  .chart .axis { font-size: 10px; fill: var(--faint); }
  .chart .val { font-size: 10.5px; fill: var(--text); font-weight: 650; }
  .chart .gridline { stroke: rgba(240, 246, 252, 0.05); stroke-width: 1; }

  .share-track {
    display: flex; height: 10px; border-radius: 6px; overflow: hidden;
    background: var(--track); margin-bottom: 12px;
  }
  .share-track div { height: 100%; }
  .legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(240, 246, 252, 0.035); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 11px;
  }
  .chip .dot { width: 7px; height: 7px; box-shadow: none; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 16px; }
  th {
    text-align: left; color: var(--faint); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.6px;
    padding: 7px 10px; border-bottom: 1px solid var(--border-strong);
  }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tbody tr, table tr { transition: background .15s ease; }
  table tr:hover td { background: rgba(240, 246, 252, 0.025); }
  .task-cell { color: var(--muted); max-width: 480px; line-height: 1.45; }
  .ok-mark { color: var(--green); font-weight: 600; }
  .fail-mark { color: var(--red); font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; }
  .agent-pill {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    font-weight: 600; font-size: 12px; border-radius: 999px; padding: 2.5px 10px;
    border: 1px solid transparent;
  }
  .agent-pill .dot { width: 7px; height: 7px; box-shadow: none; }
  .mode-tag {
    font-size: 11px; color: var(--muted); border: 1px solid var(--border-strong);
    border-radius: 999px; padding: 1.5px 9px;
  }

  .now-working { margin-bottom: 22px; }
  .now-working .card { padding: 16px 20px; }
  .now-working .heading {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 10px;
  }
  .now-working .title {
    font-size: 13px; font-weight: 650; letter-spacing: -0.005em;
    display: flex; align-items: center; gap: 9px;
  }
  .now-working .title::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.45);
    animation: pulse 2.4s infinite;
  }
  .now-working .idle .title::before {
    background: var(--faint); animation: none; box-shadow: none;
  }
  .now-working .count { color: var(--muted); font-size: 12px; }
  .now-working table { margin-top: 0; }
  .now-working th, .now-working td { padding: 7px 10px; }
  .now-working .repo {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 12.5px; color: var(--text);
  }
  .now-working .elapsed {
    font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap;
  }
  .status-tag {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px;
    border: 1px solid transparent;
  }
  .status-running {
    color: var(--green); background: rgba(63, 185, 80, 0.10);
    border-color: rgba(63, 185, 80, 0.35);
  }
  .status-running .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 6px rgba(63, 185, 80, 0.6);
  }
  .status-ok {
    color: var(--green); background: rgba(63, 185, 80, 0.08);
    border-color: rgba(63, 185, 80, 0.28);
  }
  .status-fail {
    color: var(--red); background: rgba(248, 81, 73, 0.08);
    border-color: rgba(248, 81, 73, 0.32);
  }
  .status-interrupted {
    color: var(--yellow); background: rgba(210, 153, 34, 0.10);
    border-color: rgba(210, 153, 34, 0.32);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">◎</div>
      <div>
        <h1>AI Usage Tracker</h1>
        <div class="tagline">Claude · Codex · Gemini · Cursor — one quota picture</div>
      </div>
    </div>
    <div class="meta">
      <span class="live"><span class="pulse"></span><span id="updated">loading…</span></span>
      <button id="refresh">Refresh</button>
    </div>
  </header>
  <div class="now-working" id="now-working"></div>
  <div class="grid" id="grid">
    <div class="card"><h2>Claude</h2><div class="skeleton">loading…</div></div>
    <div class="card"><h2>Codex</h2><div class="skeleton">loading…</div></div>
    <div class="card"><h2>Gemini</h2><div class="skeleton">loading…</div></div>
    <div class="card"><h2>Cursor</h2><div class="skeleton">loading…</div></div>
  </div>
  <div class="section-title">Daily analytics</div>
  <div class="card" id="history"><div class="skeleton">loading…</div></div>
  <div class="section-title">Dispatch routing</div>
  <div class="card" id="dispatches"><div class="skeleton">loading…</div></div>
</div>

<script>
const SERVICES = [
  { id: "claude", name: "Claude", color: "#d97757" },
  { id: "codex",  name: "Codex",  color: "#74aa9c" },
  { id: "gemini", name: "Gemini", color: "#4285f4" },
  { id: "cursor", name: "Cursor", color: "#a78bfa" },
];

function fillColor(pct) {
  if (pct >= 90) return "var(--red)";
  if (pct >= 70) return "var(--yellow)";
  return "var(--green)";
}

function fmtReset(epoch) {
  if (!epoch) return "";
  const diff = epoch * 1000 - Date.now();
  if (diff <= 0) return "window already reset — data may be stale";
  const h = Math.floor(diff / 3.6e6), m = Math.round((diff % 3.6e6) / 6e4);
  if (h >= 48) return `resets in ${Math.round(h / 24)}d`;
  if (h > 0) return `resets in ${h}h ${m}m`;
  return `resets in ${m}m`;
}

function fmtAgo(epoch) {
  if (!epoch) return "";
  const s = Math.max(0, Math.round(Date.now() / 1000 - epoch));
  if (s < 90) return "just now";
  if (s < 5400) return `${Math.round(s / 60)} min ago`;
  if (s < 172800) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} d ago`;
}

function fmtElapsed(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60), rs = s % 60;
  if (m < 60) return `${m}m ${String(rs).padStart(2, "0")}s`;
  const h = Math.floor(m / 60), rm = m % 60;
  if (h < 24) return `${h}h ${String(rm).padStart(2, "0")}m`;
  const d = Math.floor(h / 24);
  return `${d}d ${h % 24}h`;
}

function bar(label, pct, resetsAt) {
  const clamped = Math.min(100, Math.max(0, pct));
  return `<div class="bar-row">
    <div class="bar-head"><span>${label}</span><span class="pct">${pct}% used</span></div>
    <div class="track"><div class="fill" style="width:${clamped}%;background:${fillColor(clamped)}"></div></div>
    <div class="sub">${fmtReset(resetsAt)}</div>
  </div>`;
}

function renderWindows(d) {
  let html = (d.windows || []).map(w => bar(w.label, w.used_percent, w.resets_at)).join("");
  return html || `<div class="error">no rate-limit windows reported</div>`;
}

function renderCursor(d) {
  const money = (v) => "$" + v.toLocaleString(undefined, { maximumFractionDigits: 2 });
  let html = `<div class="bigstat">${money(d.remaining_usd)} <span>left of ${money(d.limit_usd)}</span></div>
    <div class="sub" style="margin-bottom:14px">${money(d.used_usd)} used this cycle</div>`;
  html += bar("Included usage", d.percent_used, d.cycle_end);
  if (d.on_demand) {
    html += `<div class="sub">On-demand: ${money(d.on_demand.used_usd)} used${d.on_demand.limit_usd ? " of " + money(d.on_demand.limit_usd) : ""}</div>`;
  }
  return html;
}

function renderCard(svc, d) {
  let inner;
  if (!d || !d.ok) {
    inner = `<div class="error">${(d && d.error) || "no data"}</div>`;
  } else if (svc.id === "cursor") {
    inner = renderCursor(d);
  } else {
    inner = renderWindows(d);
    if (svc.id === "codex" && d.has_credits) {
      inner += `<div class="sub">credits balance: ${d.credits_balance}</div>`;
    }
    if (svc.id === "gemini" && d.daily_limit) {
      inner += `<div class="sub">${d.requests_today} of ~${d.daily_limit} requests today (local estimate)</div>`;
    }
  }
  const plan = d && d.plan ? `<div class="plan">${d.plan}</div>` : `<div class="plan">&nbsp;</div>`;
  const note = d && d.ok
    ? `<div class="footer-note">as of ${fmtAgo(d.as_of)} · ${d.source || ""}</div>` : "";
  return `<div class="card" style="--accent:${svc.color}">
    <h2><span class="dot" style="background:${svc.color};color:${svc.color}"></span>${svc.name}</h2>
    ${plan}${inner}${note}
  </div>`;
}

function agentColor(agent) {
  const svc = SERVICES.find(s => s.id === agent);
  return svc ? svc.color : "var(--muted)";
}

function agentPill(agent) {
  const c = agentColor(agent);
  return `<span class="agent-pill" style="background:${c}18;border-color:${c}40;color:${c}">
    <span class="dot" style="background:${c}"></span>${esc(agent)}</span>`;
}

function esc(s) {
  const div = document.createElement("div");
  div.textContent = s == null ? "" : String(s);
  return div.innerHTML;
}

function dispatchResult(r) {
  if (r.status === "running") {
    return `<span class="status-tag status-running"><span class="dot"></span>running</span>`;
  }
  if (r.status === "interrupted") {
    return `<span class="status-tag status-interrupted">interrupted</span>`;
  }
  // legacy / finished / closed interactive
  if (r.mode === "interactive") {
    return `<span class="mode-tag">interactive</span>`;
  }
  return r.exit_code === 0
    ? `<span class="status-tag status-ok">✓ ok</span>`
    : `<span class="status-tag status-fail">✗ exit ${esc(r.exit_code)}</span>`;
}

function renderNowWorking(data) {
  const container = document.getElementById("now-working");
  const active = (data && data.active) || [];
  const skew = _serverSkew(data);
  if (!active.length) {
    container.innerHTML = `<div class="card idle">
      <div class="heading">
        <div class="title">Now working</div>
        <span class="count">nothing dispatched right now</span>
      </div></div>`;
    return;
  }
  const rows = active.map(r => {
    const repo = r.repo || (r.cwd ? r.cwd.split("/").pop() : "—");
    const startedAt = r.started_at || r.ts || 0;
    const why = r.forced ? "forced with --agent" : (r.reason || "");
    return `<tr data-started="${startedAt}">
      <td>${agentPill(r.agent)}</td>
      <td><span class="repo">${esc(repo)}</span></td>
      <td class="task-cell">${esc(r.task)}${why ? `<div class="sub">${esc(why)}</div>` : ""}</td>
      <td class="elapsed" data-elapsed>${fmtElapsed(_liveElapsed(startedAt, skew))}</td>
      <td>${dispatchResult(r)}</td>
    </tr>`;
  }).join("");
  container.innerHTML = `<div class="card">
    <div class="heading">
      <div class="title">Now working</div>
      <span class="count">${active.length} in flight</span>
    </div>
    <table>
      <tr><th>agent</th><th>repo</th><th>task</th><th>elapsed</th><th>status</th></tr>
      ${rows}
    </table>
  </div>`;
}

function _serverSkew(data) {
  // Server clock minus local clock, in seconds. Used to keep elapsed times
  // accurate even if the dashboard is loaded on a machine whose clock has
  // drifted vs. the tracker host (usually the same machine, so ~0).
  if (!data || typeof data.server_time !== "number") return 0;
  return data.server_time - Math.floor(Date.now() / 1000);
}

function _liveElapsed(startedAt, skew) {
  return Math.floor(Date.now() / 1000) + (skew || 0) - startedAt;
}

function tickElapsed() {
  const skew = _serverSkew(lastDispatches);
  document.querySelectorAll("#now-working tr[data-started]").forEach(row => {
    const started = Number(row.getAttribute("data-started")) || 0;
    if (!started) return;
    const cell = row.querySelector("[data-elapsed]");
    if (cell) cell.textContent = fmtElapsed(_liveElapsed(started, skew));
  });
}

function renderDispatches(data) {
  const records = (data && data.records) || [];
  const stats = (data && data.stats) || {};
  if (!records.length) {
    return `<div class="skeleton">No dispatches yet — run <b>./ai "some task"</b> and routing decisions will show up here.</div>`;
  }
  const totalForShare = Object.values(stats).reduce((a, s) => a + s.total, 0) || records.length;
  const shareBar = SERVICES
    .filter(s => stats[s.id])
    .map(s => `<div style="width:${(stats[s.id].total / totalForShare * 100).toFixed(1)}%;background:${s.color}"></div>`)
    .join("");
  const legend = SERVICES
    .filter(s => stats[s.id])
    .map(s => `<span class="chip"><span class="dot" style="background:${s.color}"></span>${s.name}: ${stats[s.id].total} total · ${stats[s.id].last_24h} in 24h</span>`)
    .join("");
  const rows = records.slice(0, 20).map(r => {
    const why = r.forced ? "forced with --agent" : (r.reason || "");
    return `<tr>
      <td style="white-space:nowrap" class="num">${fmtAgo(r.ts)}</td>
      <td>${agentPill(r.agent)}</td>
      <td>${dispatchResult(r)}</td>
      <td class="task-cell">${esc(r.task)}<div class="sub">${esc(why)}</div></td>
    </tr>`;
  }).join("");
  return `<div class="share-track">${shareBar}</div>
    <div class="legend">${legend}</div>
    <table>
      <tr><th>when</th><th>agent</th><th>result</th><th>task &amp; routing reason</th></tr>
      ${rows}
    </table>`;
}

function barChart(days, valueOf, opts) {
  // days: array of day rows; valueOf(day) -> number or [{value,color}] segments
  const W = 460, H = 160, padB = 20, padT = 18;
  const n = days.length;
  if (!n) return `<div class="skeleton">no data yet</div>`;
  const totals = days.map(d => {
    const v = valueOf(d);
    return Array.isArray(v) ? v.reduce((a, s) => a + s.value, 0) : v;
  });
  const max = Math.max(...totals, opts.minMax || 1);
  const slot = W / n, bw = Math.min(36, slot * 0.62);
  let out = "";
  for (let g = 1; g <= 3; g++) {
    const y = padT + (H - padB - padT) * (g / 4);
    out += `<line class="gridline" x1="0" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
  }
  days.forEach((d, i) => {
    const x = slot * i + (slot - bw) / 2;
    const v = valueOf(d);
    const segments = Array.isArray(v) ? v : [{ value: v, color: opts.color }];
    let y = H - padB;
    segments.forEach((seg, si) => {
      const h = (seg.value / max) * (H - padB - padT);
      if (h > 0) {
        y -= h;
        out += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${seg.color}" opacity="0.92"/>`;
      }
    });
    if (totals[i] > 0) {
      out += `<text class="val" x="${(x + bw / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle">${opts.fmt(totals[i])}</text>`;
    }
    out += `<text class="axis" x="${(x + bw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${d.date.slice(5)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${out}</svg>`;
}

function renderHistory(data) {
  const days = (data && data.days) || [];
  if (!days.length) {
    return `<div class="skeleton">No history yet — snapshots accumulate every 10 minutes while the server runs.</div>`;
  }
  const money = (v) => "$" + (v >= 100 ? v.toFixed(0) : v.toFixed(2));
  const spendChart = barChart(days, d => d.cursor_spend_usd,
    { color: agentColor("cursor"), fmt: money, minMax: 1 });
  const dispatchChart = barChart(days,
    d => SERVICES.map(s => ({ value: (d.dispatches || {})[s.id] || 0, color: s.color })),
    { fmt: v => v, minMax: 1 });
  const legend = SERVICES
    .map(s => `<span class="chip"><span class="dot" style="background:${s.color}"></span>${s.name}</span>`)
    .join("");
  const rows = days.slice(-14).reverse().map(d => {
    const total = Object.values(d.dispatches || {}).reduce((a, b) => a + b, 0);
    const perAgent = SERVICES
      .filter(s => (d.dispatches || {})[s.id])
      .map(s => `${s.name.toLowerCase()} ${d.dispatches[s.id]}`)
      .join(" · ") || "—";
    const peak = (k) => d.peaks && d.peaks[k] != null ? d.peaks[k] + "%" : "—";
    return `<tr>
      <td style="white-space:nowrap" class="num">${d.date}</td>
      <td class="num">${d.cursor_spend_usd ? money(d.cursor_spend_usd) : "—"}</td>
      <td class="num">${peak("claude_five_hour")}</td>
      <td class="num">${peak("codex_primary")}</td>
      <td class="num">${d.peaks && d.peaks.gemini_requests != null ? d.peaks.gemini_requests : "—"}</td>
      <td class="num">${total || "—"}<div class="sub">${perAgent}</div></td>
    </tr>`;
  }).join("");
  return `<div class="charts">
      <div class="chart"><div class="chart-title">Cursor spend per day (measured $ deltas)</div>${spendChart}</div>
      <div class="chart"><div class="chart-title">Dispatches per day by agent</div>${dispatchChart}
        <div class="legend" style="margin-top:8px">${legend}</div></div>
    </div>
    <table>
      <tr><th>date</th><th>cursor $</th><th>claude peak 5h</th><th>codex peak 5h</th><th>gemini reqs</th><th>dispatches</th></tr>
      ${rows}
    </table>
    <div class="footer-note">Spend is summed from usage snapshots taken while the server runs; days before this feature shipped have dispatch counts only.</div>`;
}

let lastData = null;
let lastDispatches = null;
let lastHistory = null;

async function load(force) {
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "…";
  try {
    const [usageResp, dispatchResp, historyResp] = await Promise.all([
      fetch("/api/usage" + (force ? "?refresh=1" : "")),
      fetch("/api/dispatches"),
      fetch("/api/history?days=14"),
    ]);
    lastData = await usageResp.json();
    lastDispatches = await dispatchResp.json();
    lastHistory = await historyResp.json();
    render();
  } catch (e) {
    document.getElementById("updated").textContent = "fetch failed — is the server running?";
  } finally {
    btn.disabled = false; btn.textContent = "Refresh";
  }
}

function render() {
  if (!lastData) return;
  document.getElementById("grid").innerHTML =
    SERVICES.map(s => renderCard(s, lastData.services[s.id])).join("");
  renderNowWorking(lastDispatches);
  document.getElementById("dispatches").innerHTML = renderDispatches(lastDispatches);
  document.getElementById("history").innerHTML = renderHistory(lastHistory);
  document.getElementById("updated").textContent =
    "updated " + new Date(lastData.fetched_at * 1000).toLocaleTimeString();
}

async function pollDispatches() {
  try {
    const resp = await fetch("/api/dispatches");
    lastDispatches = await resp.json();
    renderNowWorking(lastDispatches);
    document.getElementById("dispatches").innerHTML = renderDispatches(lastDispatches);
  } catch (_) { /* silent — full load will retry */ }
}

document.getElementById("refresh").addEventListener("click", () => load(true));
load(false);
setInterval(() => load(false), 60000);
setInterval(render, 30000); // keep countdowns fresh
setInterval(pollDispatches, 3000); // live "now working" panel
setInterval(tickElapsed, 1000);   // tick the visible elapsed clock every second
</script>
</body>
